# Golden queries for retrieval evaluation.
#
# Each entry asserts that a natural-language query should retrieve a moment
# (or moments) inside a known video. When the eval runner sees entries here it
# uses them; when this file is empty, it falls back to synthetic eval that
# paraphrases random transcript segments and checks that the paraphrase
# retrieves its source.
#
# Schema:
#   - query: "free-form question"
#     expected:
#       - video_id: "youtube_id"      # required
#         t_min: 0                     # inclusive, seconds. Optional.
#         t_max: 1800                  # inclusive, seconds. Optional.
#     notes: "what this query is testing"   # optional
#
# A result is a "hit" if it shares video_id with any expected entry AND the
# segment overlaps [t_min, t_max] when those bounds are present.
#
# These 9 entries are the demo queries the home page shows (5 cycling
# examples + the natural-language queries from the hero animation, minus the
# one where the system's current top-1 had a judge score of 0.70 rather than
# 1.0). They were seeded by inspecting demo-eval-latest.json after a live run
# and listing the videoIds the judge marked 1.0. Treating the system's
# high-confidence answers as ground truth is a deliberate bootstrap choice.
# This catches regressions even before we have human-labelled gold.

queries:
  - query: "female founders building a service business"
    expected:
      - video_id: "rqJM6mFhyes"
    notes: "cycling example #2, gender filter + service-business intent"

  - query: "home services hiring their first sales team"
    expected:
      - video_id: "jqo0lVveh98"
      - video_id: "0EqJD2o-Mnk"
    notes: "cycling example #3, home_services industry + sales_team_building topic"

  - query: "agency owners around $1-5M with churn problems"
    expected:
      - video_id: "0coMtm_i1UA"
    notes: "cycling example #5, agency + $1-5M + customer_retention_and_churn"

  - query: "Young male restaurant owners"
    expected:
      - video_id: "pobfyHIItag"
    notes: "hero animation #1, food_and_beverage + male"

  - query: "Med spa owners doing under $5M"
    expected:
      - video_id: "Ok8cv-ivKIw"
      - video_id: "rqJM6mFhyes"
      - video_id: "TaeBazpcRk8"
    notes: "hero animation #2, wellness + revenue band"

  - query: "Ecommerce founders doing over $10M"
    expected:
      - video_id: "EjBgv-DGJ-M"
      - video_id: "HlK_MeYWKEs"
    notes: "hero animation #3, capital raising + scaling intent above $10M"

  - query: "Business owners over $1M dealing with churn"
    expected:
      - video_id: "TaeBazpcRk8"
      - video_id: "0coMtm_i1UA"
    notes: "hero animation #4, revenue band + retention/churn topic"

  - query: "Business owners over $50M"
    expected:
      - video_id: "HlK_MeYWKEs"
      - video_id: "bYGRh4ZOdUo"
    notes: "hero animation #5, $25M+ revenue band"
